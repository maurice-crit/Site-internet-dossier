<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station Spatiale - Système Intégré (BETA)</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    
    <!-- NOUVEAU MENU MINIMAP -->
<div id="minimap-container">
    <div class="minimap-title">CARTE TACTIQUE</div>
    
    <svg id="minimap-lines" width="100%" height="100%">
        <line x1="25%" y1="40%" x2="75%" y2="40%" stroke="#00ffcc" stroke-width="2" stroke-dasharray="4,4" />
        <line x1="75%" y1="40%" x2="75%" y2="80%" stroke="#00ffcc" stroke-width="2" stroke-dasharray="4,4" />
    </svg>

    <button class="nav-btn-map" id="btn-chambre" data-target="chambre">CHAMBRE</button>
    <button class="nav-btn-map" id="btn-module-b" data-target="module-b">MODULE SG</button>
    <button class="nav-btn-map" id="btn-cockpit" data-target="cockpit">COCKPIT</button>
</div>

    <div id="app-wrapper"> 
        <div id="pin-container"> 

            <!-- CHAMBRE -->
            <section id="room-chambre" class="scene">
                <div class="layer">
                    <img src="images/chambre.png" alt="Chambre" class="bg-image">
                </div>
                <div class="construction-overlay">
                    <div class="construction-banner">🚧 EN TRAVAUX 🚧</div>
                </div>
            </section>

            <!-- MODULE B -->
            <section id="room-module-b" class="scene">
                <div id="module-b-arriere-plan" class="layer">
                    <!-- IMAGE DE FOND -->
                    <img src="images/module Bbis.png" alt="Intérieur avec équipage" class="bg-image">
                </div>
                
                <!-- HITBOXES INTERACTIVES ET FAISCEAUX LUMINEUX -->
                <div id="module-b-decors" class="layer" style="z-index: 20;">
                    <div id="decor-sg" title="Zone d'accès restreint"></div>
                    
                    <!-- Patxi (Image flottante avec son halo) -->
                    <div class="crew-wrapper" id="wrap-patxi">
                        <img src="images/patxi.png" alt="Patxi" class="crew-member" id="char-patxi" data-presentation="images/p-patxi.png">
                        <div class="light-beam"></div>
                    </div>

                    <!-- Mateo (Hitbox avec son halo) -->
                    <div class="crew-wrapper" id="wrap-mateo">
                        <div class="crew-member" id="char-mateo" data-presentation="images/p-mateo.png"></div>
                        <div class="light-beam"></div>
                    </div>

                    <!-- Louis -->
                    <div class="crew-wrapper" id="wrap-louis">
                        <div class="crew-member" id="char-louis" data-presentation="images/p-louis.png"></div>
                        <div class="light-beam"></div>
                    </div>

                    <!-- JB -->
                    <div class="crew-wrapper" id="wrap-jb">
                        <div class="crew-member" id="char-jb" data-presentation="images/p-jb.png"></div>
                        <div class="light-beam"></div>
                    </div>

                    <!-- Lila -->
                    <div class="crew-wrapper" id="wrap-lila">
                        <div class="crew-member" id="char-lila" data-presentation="images/p-lila.png"></div>
                        <div class="light-beam"></div>
                    </div>
                </div>
            </section> <!-- La balise en trop a été retirée juste au-dessus de cette ligne ! -->

            <!-- COCKPIT -->
            <section id="room-cockpit" class="scene">
                <div id="cockpit-arriere-plan" class="layer">
                    <img src="images/cockpit.png" alt="Vue du cockpit" class="bg-image">
                </div>
                <div class="construction-overlay">
                    <div class="construction-banner">🚧 EN TRAVAUX 🚧</div>
                </div>
            </section>
            
        </div> <!-- FIN DU PIN-CONTAINER -->
        
        <div id="hologram-transition"></div>
    </div> 

    <!-- L'Overlay Équipage avec GLITCH -->
    <div id="main-overlay" class="overlay">
        <div class="overlay-content">
            <span class="close-btn" id="close-crew">&times;</span>
            <div class="glitch-container" id="glitch-target">
                <div class="glitch__img"></div>
                <div class="glitch__img"></div>
                <div class="glitch__img"></div>
            </div>
            <p style="color: #00ffcc; letter-spacing: 2px;">-- TRANSMISSION EN COURS --</p>
        </div>
    </div>

    <!-- Autres overlays -->
    <div id="overlay-infos-menu" class="overlay">
        <div class="terminal-content">
            <span class="close-btn" id="close-infos">&times;</span>
            <div class="terminal-header">SYSTÈME CENTRAL</div>
            <div class="menu-container">
                <button class="terminal-btn" data-file="reglement.pdf">REGLEMENT</button>
                <button class="terminal-btn" data-file="adhesion.pdf">ADHESION</button>
                <button class="terminal-btn" data-file="pre-dossier.pdf">DOSS</button>
            </div>
        </div>
    </div>

    <div id="overlay-gallery" class="overlay">
        <div class="gallery-wrapper">
            <span class="close-btn" id="close-gallery">&times;</span>
            <div class="gallery-header">
                <h2 class="gallery-title">COMBARS</h2>
            </div>
            <div class="gallery-grid">
                <div class="combar-slot"><img src="images/tablar.png" alt="Tablar" class="combar-image"></div>
                <div class="combar-slot"><img src="images/limoges.png" alt="Limoges" class="combar-image"></div>
                <div class="combar-slot">Photo 3</div>
                <div class="combar-slot">Photo 4</div>
            </div>
        </div>
    </div>

    <div id="overlay-sg" class="overlay">
        <div class="terminal-content" style="width: 450px;">
            <span class="close-btn" id="close-sg">&times;</span>
            <div class="terminal-header" style="color: #cc00ff; border-color: #cc00ff;">PROTOCOLE SG</div>
            <div id="sg-auth-zone">
                <p style="color: #cc00ff;">CODE D'ACCÈS :</p>
                <input type="password" id="sg-pwd" class="terminal-input" placeholder="****">
                <button id="sg-submit" class="terminal-btn" style="margin-top: 20px; border-color: #cc00ff; color: #cc00ff;">VALIDER</button>
                <p id="sg-error" style="color: #ff4444; display: none; margin-top: 15px;">REFUSÉ</p>
                <button class="terminal-btn close-btn-internal" style="margin-top: 30px; border-color: #ff4444; color: #ff4444; width: 100%;">QUITTER</button>
            </div>
            <div id="sg-secret-zone" class="menu-container" style="display: none;">
                <button class="terminal-btn">COMPLETE</button>
                <button class="terminal-btn">DS</button>
                <button class="terminal-btn close-btn-internal" style="margin-top: 20px; border-color: #ff4444; color: #ff4444;">DÉCONNEXION</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="script.js"></script> 
</body>
</html>
