<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station Spatiale - Système Intégré</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    
    <nav id="menu-navigation">
        <button class="nav-btn" data-target="module-b">MODULE B (HAUT)</button>
        <button class="nav-btn" data-target="cockpit">COCKPIT (BAS)</button>
    </nav>

    <div id="app-wrapper"> 
        <div id="pin-container"> 

            <section id="room-module-b" class="scene">
                <div id="module-b-arriere-plan" class="layer">
                    <img src="images/module Bbis.png" alt="Intérieur" class="bg-image">
                </div>
                
                <div id="module-b-decors" class="layer">
                    <img src="images/trailer.png" alt="Bande Annonce" id="decor-trailer">
                    <img src="images/combar.png" alt="Galerie Combars" id="decor-combar">
                    <img src="images/SG.png" alt="Accès Restreint SG" id="decor-sg">
                </div>

                <div id="module-b-milieu" class="layer">
                    <h2 style="color: white; text-shadow: 2px 2px 10px #00ffcc;">Laboratoire de Recherche B</h2>
                    
                    <img src="images/patxi.png" alt="Patxi" class="crew-member" id="char-patxi" data-presentation="images/p-patxi.png">
                    <img src="images/ln.png" alt="LN" class="crew-member" id="char-ln" data-presentation="images/p-ln.png">
                    <img src="images/yanisr.png" alt="YanisR" class="crew-member" id="char-yanisr" data-presentation="images/p-yanisr.png">
                    <img src="images/mateo.png" alt="Mateo" class="crew-member" id="char-mateo" data-presentation="images/p-mateo.png">
                    <img src="images/jules.png" alt="Jules" class="crew-member" id="char-jules" data-presentation="images/p-jules.png">
                    <img src="images/louis.png" alt="Louis" class="crew-member" id="char-louis" data-presentation="images/p-louis.png">
                    <img src="images/jb.png" alt="JB" class="crew-member" id="char-jb" data-presentation="images/p-jb.png">
                    <img src="images/lila.png" alt="Lila" class="crew-member" id="char-lila" data-presentation="images/p-lila.png">
                </div>
            </section>

            <section id="room-cockpit" class="scene">
                <div id="cockpit-arriere-plan" class="layer">
                    <img src="images/cocpit.jpeg" alt="Vue du cockpit" class="bg-image">
                </div>
                
                <div id="cockpit-infos" class="layer">
                    <img src="images/infos.png" alt="Accès Système" id="decor-infos">
                </div>

                <div id="cockpit-milieu" class="layer">
                    <h2 id="titre-cockpit" style="color: white; text-shadow: 2px 2px 10px #00ffcc; margin-bottom: 20px;">Poste de Pilotage</h2>
                    
                    <img src="images/maite.png" alt="Maite" class="crew-member" id="char-maite" data-presentation="images/p-maite.png">
                    <img src="images/capu.png" alt="Capu" class="crew-member" id="char-capu" data-presentation="images/p-capu.png">
                    <img src="images/ad.png" alt="Ad" class="crew-member" id="char-ad" data-presentation="images/p-ad.png">
                    <img src="images/Yanis.png" alt="Yanis" class="crew-member" id="char-yanis" data-presentation="images/p-yanis.png">
                    <img src="images/louna.png" alt="Louna" class="crew-member" id="char-louna" data-presentation="images/p-louna.png">
                    <img src="images/lucas.png" alt="Lucas" class="crew-member" id="char-lucas" data-presentation="images/p-lucas.png">
                    <img src="images/antoine.png" alt="Antoine" class="crew-member" id="char-antoine" data-presentation="images/p-antoine.png">
                </div>
            </section>
        </div> 
    </div> 

    <div id="main-overlay" class="overlay">
        <div class="overlay-content">
            <span class="close-btn" id="close-crew">&times;</span>
            <img src="" alt="Fiche" id="overlay-image-zoom">
            <p>-- TRANSMISSION EN COURS --</p>
        </div>
    </div>

    <div id="overlay-infos-menu" class="overlay">
        <div class="terminal-content">
            <span class="close-btn" id="close-infos">&times;</span>
            <div class="terminal-header">SYSTÈME CENTRAL</div>
            <div class="menu-container">
                <button class="terminal-btn" data-file="reglement.pdf">REGLEMENT</button>
                <button class="terminal-btn" data-file="adhesion.pdf">ADHESION</button>
                <button class="terminal-btn" data-file="pre-dossier.pdf">DOSS</button>
            </div>
        </div>
    </div>

    <div id="overlay-gallery" class="overlay">
        <div class="gallery-wrapper">
            <span class="close-btn" id="close-gallery">&times;</span>
            <div class="gallery-header">
                <h2 class="gallery-title">COMBARS</h2>
            </div>
            <div class="gallery-grid">
                <div class="combar-slot">Photo 1</div>
                <div class="combar-slot">Photo 2</div>
                <div class="combar-slot">Photo 3</div>
                <div class="combar-slot">Photo 4</div>
                <div class="combar-slot">Photo 5</div>
                <div class="combar-slot">Photo 6</div>
                <div class="combar-slot">Photo 7</div>
                <div class="combar-slot">Photo 8</div>
                <div class="combar-slot">Photo 9</div>
                <div class="combar-slot">Photo 10</div>
                <div class="combar-slot">Photo 11</div>
                <div class="combar-slot">Photo 12</div>
                </div>
        </div>
    </div>

    <div id="overlay-sg" class="overlay">
        <div class="terminal-content" style="width: 450px;">
            <span class="close-btn" id="close-sg">&times;</span>
            <div class="terminal-header" style="color: #cc00ff; border-color: #cc00ff;">PROTOCOLE SG</div>
            <div id="sg-auth-zone">
                <p style="color: #cc00ff;">CODE D'ACCÈS :</p>
                <input type="password" id="sg-pwd" class="terminal-input" placeholder="****">
                <button id="sg-submit" class="terminal-btn" style="margin-top: 20px; border-color: #cc00ff; color: #cc00ff;">VALIDER</button>
                <p id="sg-error" style="color: #ff4444; display: none; margin-top: 15px;">REFUSÉ</p>
                <button class="terminal-btn close-btn-internal" style="margin-top: 30px; border-color: #ff4444; color: #ff4444; width: 100%;">QUITTER</button>
            </div>
            <div id="sg-secret-zone" class="menu-container" style="display: none;">
                <button class="terminal-btn">COMPLETE</button>
                <button class="terminal-btn">DS</button>
                <button class="terminal-btn close-btn-internal" style="margin-top: 20px; border-color: #ff4444; color: #ff4444;">DÉCONNEXION</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="script.js"></script> 
</body>
</html>
